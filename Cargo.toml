[workspace]
resolver = "3"
members = [
    "crates/crypto",
    "crates/tx",
    "crates/validator",
    "cmd/karsa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
