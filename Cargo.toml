[workspace]
resolver = "3"
members = [
    "crates/crypto",
    "crates/tx",
    "crates/exec",
    "crates/validator",
    "crates/net",
    "crates/store",
    "cmd/karsa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# SLH-DSA is hashing-bound: an unoptimised hashing dependency makes its tests
# and ACVP run take minutes. The rest of the workspace keeps the normal dev
# profile.
[profile.dev.package.slh-dsa]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
