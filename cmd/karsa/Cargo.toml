[package]
name = "karsa"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Karsa command-line entry point"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
crypto = { path = "../../crates/crypto", features = ["pq-openssl", "pq-slh"] }
erasure = { path = "../../crates/erasure" }
exec = { path = "../../crates/exec" }
hex = "0.4"
net = { path = "../../crates/net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
toml = "0.8"
store = { path = "../../crates/store" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tx = { path = "../../crates/tx" }
validator = { path = "../../crates/validator" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
