syntax = "proto3";
package karsa.amm.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "karsa/amm/v1/amm.proto";

option go_package = "github.com/karsahq/karsa/x/amm/types";

// Query defines the amm Query service.
service Query {
  rpc Pool(QueryPoolRequest) returns (QueryPoolResponse);
  rpc Pools(QueryPoolsRequest) returns (QueryPoolsResponse);
  rpc PoolByAssets(QueryPoolByAssetsRequest) returns (QueryPoolByAssetsResponse);
  rpc PoolsByAssets(QueryPoolsByAssetsRequest) returns (QueryPoolsByAssetsResponse);
  rpc Quote(QueryQuoteRequest) returns (QueryQuoteResponse);
  rpc QuoteExactOut(QueryQuoteExactOutRequest) returns (QueryQuoteExactOutResponse);
  rpc Twap(QueryTwapRequest) returns (QueryTwapResponse);
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse);
}

message QueryPoolRequest {
  uint64 pool_id = 1;
}

message QueryPoolResponse {
  Pool pool = 1 [(gogoproto.nullable) = false];
}

message QueryPoolsRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryPoolsResponse {
  repeated Pool pools = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryPoolByAssetsRequest {
  string asset_a = 1;
  string asset_b = 2;
}

message QueryPoolByAssetsResponse {
  Pool pool = 1 [(gogoproto.nullable) = false];
}

message QueryPoolsByAssetsRequest {
  string asset_a = 1;
  string asset_b = 2;
}

message QueryPoolsByAssetsResponse {
  repeated Pool pools = 1 [(gogoproto.nullable) = false];
}

message QueryQuoteRequest {
  repeated string path = 1;
  string amount_in = 2
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // Optional pool id per hop. Empty means the unique pool for the pair.
  repeated uint64 pool_ids = 3;
}

message QueryQuoteResponse {
  string amount_out = 1
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
}

message QueryQuoteExactOutRequest {
  repeated string path = 1;
  string amount_out = 2
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // Optional pool id per hop. Empty means the unique pool for the pair.
  repeated uint64 pool_ids = 3;
}

message QueryQuoteExactOutResponse {
  string amount_in = 1
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
}

message QueryParamsRequest {}

message QueryTwapRequest {
  uint64 pool_id = 1;
  int64 window_seconds = 2;
}

message QueryTwapResponse {
  // Price of asset A denominated in asset B.
  string price_a = 1
      [(gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  // Price of asset B denominated in asset A.
  string price_b = 2
      [(gogoproto.customtype) = "cosmossdk.io/math.LegacyDec", (gogoproto.nullable) = false];
  // Window actually used, in seconds.
  int64 effective_window = 3;
}

message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false];
}
