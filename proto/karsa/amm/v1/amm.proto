syntax = "proto3";
package karsa.amm.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";

option go_package = "github.com/karsahq/karsa/x/amm/types";

// PoolType selects the pricing curve of a pool.
enum PoolType {
  POOL_TYPE_CONSTANT_PRODUCT = 0;
  POOL_TYPE_STABLESWAP = 1;
}

// Pool is a liquidity pool keyed by two ERC20 addresses.
message Pool {
  uint64 id = 1;
  // ERC20 addresses (lowercase hex) of the two assets, sorted ascending.
  string asset_a = 2;
  string asset_b = 3;
  // Bank denoms resolved from the token pairs of asset_a / asset_b.
  string denom_a = 4;
  string denom_b = 5;
  string reserve_a = 6
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string reserve_b = 7
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string total_shares = 8
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  // Shares minted to the module at creation and never redeemable.
  string locked_shares = 9
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  	uint32 fee_bps = 10;
  	string lp_denom = 11;
  	// ERC20 precompile address of the LP share (lowercase hex).
  	string lp_asset_id = 12;
	// Pricing curve. Defaults to constant product for backwards compatibility.
	PoolType pool_type = 13;
	// Amplification coefficient A for stableswap pools; 0 for constant product.
	uint64 amplification = 14;
	// Reserves are normalised to 18 decimals with these factors
	// (10^(18-decimals)). A zero value means 1.
	uint64 scaling_factor_a = 15;
	uint64 scaling_factor_b = 16;
}

// Params defines the module parameters.
message Params {
  uint32 max_hops = 1;
  uint32 default_fee_bps = 2;
  // Cap on the fee an integrator may add on top of the pool fee.
  uint32 max_integrator_fee_bps = 3;
  string min_initial_liquidity = 4
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string min_locked_shares = 5
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  repeated cosmos.base.v1beta1.Coin creation_fee = 6 [
    (gogoproto.nullable) = false,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.Coins"
  ];
  uint32 fee_burn_bps = 7;
}

// GenesisState defines the module genesis state.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false];
  repeated Pool pools = 2 [(gogoproto.nullable) = false];
  uint64 next_pool_id = 3;
}

// Observation is a cumulative-price checkpoint used for TWAP.
message Observation {
  int64 timestamp = 1;
  string cumulative_a = 2
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
  string cumulative_b = 3
      [(gogoproto.customtype) = "cosmossdk.io/math.Int", (gogoproto.nullable) = false];
}

// Observations is the ordered ring of observations for a pool.
message Observations {
  repeated Observation items = 1 [(gogoproto.nullable) = false];
}
