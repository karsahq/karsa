syntax = "proto3";
package karsa.nativetoken.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "karsa/nativetoken/v1/nativetoken.proto";

option go_package = "github.com/karsahq/karsa/x/nativetoken/types";

// Msg defines the nativetoken Msg service.
//
// There is deliberately no message that creates, mints or burns: tokens are
// created by the factory precompile and supply is only movable by a contract
// through the minter precompile. A key can do neither.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc SetTokenVerified(MsgSetTokenVerified) returns (MsgSetTokenVerifiedResponse);
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

message MsgSetTokenVerified {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1;
  string denom = 2;
  bool verified = 3;
}

message MsgSetTokenVerifiedResponse {}

message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1;
  Params params = 2 [(gogoproto.nullable) = false];
}

message MsgUpdateParamsResponse {}
